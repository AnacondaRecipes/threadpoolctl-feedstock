{% set version = "3.7.0" %}

package:
  name: threadpoolctl
  version: {{ version }}

source:
  url: https://github.com/joblib/threadpoolctl/archive/{{ version }}.tar.gz
  sha256: 435415e3dbcaa51d9f30bca91730c8483eabd83779dface976b10bf84a3a4b97

build:
  skip: true  # [py<39]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - flit-core >=3.2,<5
  run:
    - python
  run_constrained:
    - blas=*=openblas  # [osx and x86_64]

test:
  source_files:
    - tests
  requires:
    - pip
    - numpy
    - pytest
  imports:
    - threadpoolctl
  commands:
    - pip check
    - python -m threadpoolctl -i numpy
    - pytest -v tests  # [not ((linux and aarch64) or (osx and arm64))]
    # linux-aarch64 and osx-arm64 (neoversen1) are unrecognized
    # architectures on Prefect.  linux-aarch64 (m1) is perfectly OK.
    - pytest -v tests -k 'not (test_architecture)'  # [(linux and aarch64) or (osx and arm64)]

about:
  home: https://github.com/joblib/threadpoolctl
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Python helpers to control the threadpools of native libraries
  description: |
    Python helpers to introspect and limit the number of threads used
    in native libraries that handle their own internal threadpool
    (BLAS and OpenMP implementations).
  doc_url: https://github.com/joblib/threadpoolctl
  dev_url: https://github.com/joblib/threadpoolctl

extra:
  recipe-maintainers:
    - ogrisel
    - tomMoral
    - jeremiedbb
